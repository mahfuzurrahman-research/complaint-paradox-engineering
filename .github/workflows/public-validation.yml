name: Public Engineering Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run public synthetic pipeline
        run: bash run_public_demo.sh
      - name: Upload public-safe demo outputs
        uses: actions/upload-artifact@v4
        with:
          name: public-engineering-demo
          path: |
            outputs/monitor_summary.json
            outputs/sql_quality.json
            outputs/public_report.json
            outputs/public_report.md
            outputs/public_dashboard.html
